name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable package
        shell: pwsh
        run: .\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaLocal-portable
          path: dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Path dist -Filter *.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES_v0.2.0.md
